# ===========================================================================
#  Xora Backend — application.properties
#  Production-ready defaults. Override via environment variables (see
#  application-local.properties.example for local dev).
# ===========================================================================

spring.application.name=xora-backend
server.port=${PORT:8080}

# Throw NoHandlerFoundException so GlobalExceptionHandler can format 404s
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# --- Database -------------------------------------------------------------
# spring.datasource.url=${XORA_DB_URL}
# spring.datasource.username=${XORA_DB_USERNAME}
# spring.datasource.password=${XORA_DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://corestack-db.cvwakags0aj0.ap-southeast-2.rds.amazonaws.com:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=Rio8292401223
spring.datasource.driver-class-name=org.postgresql.Driver

# Validate schema in prod (Flyway owns the schema); allow update in dev only.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Flyway ---------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- CORS -----------------------------------------------------------------
app.cors.allowed-origins=${XORA_CORS_ORIGINS:http://localhost:4200}

# --- JWT ------------------------------------------------------------------
app.jwt.secret=${XORA_JWT_SECRET}
app.jwt.access-token-expiration-ms=${XORA_JWT_ACCESS_MS:900000}
app.jwt.refresh-token-expiration-ms=${XORA_JWT_REFRESH_MS:604800000}
app.jwt.issuer=xora

# --- Google OAuth ---------------------------------------------------------
app.google.client-id=${GOOGLE_CLIENT_ID:}

# --- Logging --------------------------------------------------------------
logging.level.root=INFO
logging.level.com.xora=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{40} - %msg%n
